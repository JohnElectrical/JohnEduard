<style>
:root{--bg:#0b0d16;--glass:rgba(28,30,42,.55);--fg:#f4f5f9;--mut:#a7abbd;--line:rgba(255,255,255,.14);--acc:#7aa8ff;--wp1:#3b2a7a;--wp2:#e0705f;--wp3:#1f6fa8;--e:cubic-bezier(.16,1,.3,1);--dk:54px;--px:0;--py:0;

:root[data-t=light]{--bg:#e9ecf5;--glass:rgba(255,255,255,.62);--fg:#15171f;--mut:#555b6e;--line:rgba(0,0,0,.12);--wp1:#9bb8ff;--wp2:#ffc4a8;--wp3:#a8e0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;cursor:var(--cur)}
a,button,.card,.di,[role=button],input[type=range],input[type=checkbox],select{cursor:var(--hand)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.55 "Plus Jakarta Sans",-apple-system,"SF Pro Text",system-ui,sans-serif;transition:background .6s,color .6s}
#desk{position:fixed;inset:0;overflow:hidden}
.bl{position:absolute;border-radius:50%;opacity:.8;will-change:transform;transition:transform .9s var(--e);animation:fl 22s ease-in-out infinite alternate}
.bl:nth-child(1){width:75vmax;height:75vmax;left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--wp1),transparent 68%);transform:translate(calc(var(--px)*30px),calc(var(--py)*30px))}
.bl:nth-child(2){width:68vmax;height:68vmax;right:-22vmax;bottom:-26vmax;background:radial-gradient(circle,var(--wp2),transparent 68%);animation-delay:-7s;transform:translate(calc(var(--px)*-40px),calc(var(--py)*-40px))}
.bl:nth-child(3){width:50vmax;height:50vmax;left:30%;top:25%;background:radial-gradient(circle,var(--wp3),transparent 68%);animation-delay:-12s;opacity:.55}
@keyframes fl{to{translate:5vmax 4vmax;scale:1.12}}
.gl{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line)}
.lite .gl{backdrop-filter:none;-webkit-backdrop-filter:none}
#hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px 80px;transition:transform .7s var(--e),opacity .7s}
.dim #hero{transform:scale(.97);opacity:.35}
#name{margin:0;font-size:clamp(44px,12.5vw,190px);font-weight:700;letter-spacing:-.05em;line-height:1;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em;perspective:600px}
#name .wd{display:inline-block;white-space:nowrap}
#name .wd span{display:inline-block;opacity:0;transform:translateY(60px) rotateX(-70deg);filter:blur(16px);animation:li 1.3s var(--e) forwards,wv 5s ease-in-out 2s infinite;will-change:transform}
@keyframes li{to{opacity:1;transform:none;filter:none}}@keyframes wv{0%,100%{transform:none}50%{transform:translateY(-7px)}}
#sub{margin-top:18px;font-size:clamp(14px,2.2vw,22px);color:var(--mut);letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:fu 1.2s var(--e) 1.1s forwards}
@keyframes fu{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#soc{display:flex;gap:10px;margin-top:16px;opacity:0;animation:fu 1.2s var(--e) 1.4s forwards}
#soc a{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .35s var(--e),background .3s,color .3s;cursor:var(--hand)}
#soc a:hover,#soc a:focus-visible{transform:translateY(-4px) scale(1.12);background:var(--acc);color:#fff}
#soc a::after{content:"";position:absolute;inset:-8px}
#soc svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;display:flex;gap:8px;z-index:50}
#top button{all:unset;cursor:var(--hand);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .35s var(--e)}
#top button:hover{transform:scale(1.1) rotate(15deg)}#top svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#dock{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-radius:24px;z-index:60;animation:dk 1.2s var(--e) 1.6s both}
@keyframes dk{from{opacity:0;transform:translate(-50%,60px)}}
.di{all:unset;cursor:var(--hand);position:relative;width:var(--sz);height:var(--sz);transform-origin:50% 100%;will-change:transform}
.tile{width:100%;height:100%;border-radius:23%;display:grid;place-items:center;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c),#fff 26%),var(--c) 55%,color-mix(in srgb,var(--c),#000 40%));box-shadow:0 8px 18px #0007,inset 0 1px 0 #fff7,inset 0 -1px 0 #0004}.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,#fff5,#fff0 50%)}
.tile svg{width:60%;height:60%;position:relative;fill:#fff;stroke:none;filter:drop-shadow(0 1px 1.5px #0006)}
.di::after{content:"";position:absolute;bottom:-7px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--fg);opacity:0;transform:scale(0);transition:transform .35s var(--e),opacity .25s}.di.run::after{opacity:1;transform:scale(1)}
.di:hover::before{content:attr(data-n);position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);padding:2px 10px;border-radius:8px;font-size:12px;white-space:nowrap;backdrop-filter:blur(12px)}
.di:active .tile{filter:brightness(.85)}.di.bn{animation:bn .6s var(--e)}@keyframes bn{40%{transform:translateY(-22px)}}
#wins{position:fixed;inset:0;pointer-events:none;z-index:40}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;border-radius:18px;box-shadow:0 30px 80px #0008,0 0 0 1px #fff1;overflow:hidden;animation:var(--fx,fxA) .7s var(--e)}
.win.cl{animation:cl .32s cubic-bezier(.5,0,.75,0) forwards;pointer-events:none}
.win.mn{pointer-events:none;opacity:0}.win.tr{transition:all .5s var(--e)}
@keyframes cl{to{opacity:0;transform:scale(.9) translateY(24px)}}
@keyframes fxA{from{opacity:0;transform:translateY(40px) scale(.9)}55%{}}
@keyframes fxB{from{opacity:0;transform:perspective(900px) rotateX(35deg) translateY(60px)}}
@keyframes fxC{from{opacity:0;transform:scale(.4)}60%{transform:scale(1.03)}}
@keyframes fxD{from{opacity:0;transform:translateX(-90px) skewX(-8deg)}}
@keyframes fxE{from{opacity:0;transform:rotate(-6deg) scale(.85) translateY(50px)}}
@keyframes fxF{from{opacity:0;transform:translateY(-120px) scale(1.1)}60%{transform:translateY(8px)}}
.win>.tb,.win>.bd{animation:cb .7s var(--e)}@keyframes cb{from{filter:blur(10px);opacity:0}}.win.cl>.bd{filter:blur(6px);opacity:0;transition:all .3s}
.tb{display:flex;align-items:center;height:42px;padding:0 14px;flex:none;border-bottom:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.tl{display:flex;gap:8px;width:70px}.tl button{all:unset;box-shadow:inset 0 0 0 .5px #0003;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;line-height:1;color:transparent;transition:color .15s,transform .2s;cursor:var(--hand)}
.tl:hover button,.tl button:focus-visible{color:#000a}.tl button:active{transform:scale(.85)}.tl .r{background:#ff5f57}.tl .y{background:#febc2e}.tl .g{background:#28c840}.win.ia .tl:not(:hover) button{background:#8a8d98}
.tt{flex:1;text-align:center;font-weight:600;font-size:13px;padding-right:70px}
.bd{flex:1;overflow:auto;padding:20px;-webkit-overflow-scrolling:touch}.rz{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none}
h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}h3{margin:16px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}p{margin:0 0 10px;color:var(--mut)}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#ffffff0a;transition:transform .4s var(--e),box-shadow .4s,border-color .4s}
.card:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 30px #0004;border-color:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);margin:2px 4px 2px 0;color:var(--mut)}
.empty{text-align:center;padding:36px 8px;color:var(--mut)}.warn{border:1px solid #e0a43a;background:#e0a43a1c;border-radius:12px;padding:10px 12px;color:var(--fg);margin-bottom:12px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;margin:4px 0 10px;border-radius:11px;border:1px solid var(--line);background:#ffffff10;color:var(--fg);transition:border-color .3s,box-shadow .3s}
input:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc),transparent 70%)}
.pb{font:inherit;padding:10px 18px;border:0;border-radius:11px;background:var(--acc);color:#fff;min-height:42px;transition:transform .3s var(--e)}.pb:hover{transform:scale(1.04)}.pb:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lk{text-align:center;padding:30px}.lk svg{width:64px;height:64px;fill:none;stroke:var(--acc);stroke-width:1.5;stroke-linecap:round;animation:wob 2.4s ease-in-out infinite}@keyframes wob{50%{transform:rotate(-8deg) translateY(-4px)}}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;transition:transform .5s var(--e)}.ph img:hover{transform:scale(1.07) rotate(1deg)}
:root[data-s=dark]{--glass:rgba(16,17,24,.97)}:root[data-s=dark][data-t=light]{--glass:rgba(246,247,251,.98)}:root[data-s=dark] .gl{backdrop-filter:none;-webkit-backdrop-filter:none}:root[data-s=dark] .bl{opacity:.3}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:700px){#hero{padding-bottom:120px}.win{left:20px!important;right:20px!important;top:0!important;bottom:0!important;margin:auto!important;width:auto!important;height:min(420px,58vh)!important;height:min(420px,58dvh)!important;border-radius:22px}.win.fs{top:calc(60px + env(safe-area-inset-top))!important;bottom:calc(100px + env(safe-area-inset-bottom))!important;margin:0!important;height:auto!important}.rz{display:none}.tb{height:44px}.tl{gap:10px}.tl button{width:15px;height:15px;font-size:10px;position:relative}.tl button::after{content:"";position:absolute;inset:-5px}.bd{padding:14px 14px 20px;overscroll-behavior:contain}#dock{--dk:48px;gap:8px;padding:8px 10px}#sub{letter-spacing:.08em}#top{right:10px}}
@media (hover:none){.di:hover::before{display:none}}
@media (prefers-reduced-motion:reduce){.bl{animation:none!important}#name .wd span{animation:li 1.3s var(--e) forwards!important}}

select,option{background:#14151d;color:#f2f3f8}
#dock{transform-origin:50% 100%}.calm .bl{animation:none}
.orb{position:relative;overflow:hidden;isolation:isolate}
.orb>i{position:absolute;inset:-50%;background:conic-gradient(from 0deg,#5b8cff,#b46bff,#ff6fb5,#35e0ff,#5b8cff);animation:sp 3.5s linear infinite;z-index:-2}
.orb>b{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffffcc,#fff0 55%),#0b0d16aa;animation:br 2.4s ease-in-out infinite;z-index:-1}
@keyframes sp{to{transform:rotate(1turn)}}@keyframes br{50%{transform:scale(.76);opacity:.85}}
.tile.orb{background:#0b0d16;animation:og 3s ease-in-out infinite}
@keyframes og{50%{box-shadow:0 8px 26px #8b5cf6aa,0 0 24px #38e1ff66,inset 0 1px 0 #fff7}}
.tile.orb svg{animation:tw 2.6s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(.78) rotate(0)}50%{transform:scale(1.12) rotate(28deg)}}
.th .orb>i{animation-duration:.8s}.th .orb>b{animation-duration:.7s}
[data-app=admin],[data-app=ai]{color:var(--fg)}
.win[data-app=admin]{--glass:rgba(14,16,26,.5);--fg:#eef0f7;--mut:#9aa0b6;--line:#ffffff1a;color-scheme:dark}

[data-app=admin] input,[data-app=admin] textarea{background:#ffffff0d;color:#eef0f7;border-color:#ffffff1f}
[data-app=admin] ::placeholder{color:#6f748a}[data-app=admin] label{display:block;font-size:12px;font-weight:600;color:var(--mut)}
[data-app=admin] input[type=file]::file-selector-button{all:unset;cursor:var(--hand);background:#ffffff14;color:#eef0f7;padding:6px 12px;border-radius:8px;margin-right:10px}

.ad{position:relative;display:grid;grid-template-columns:172px 1fr;height:100%;min-height:0}

.pn{overflow:auto;padding:20px;min-height:0;overscroll-behavior:contain}

.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:12px 0}

.sg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}

.ah u{width:7px;height:7px;border-radius:50%;background:#34d399;animation:pu 1.6s infinite}@keyframes pu{50%{box-shadow:0 0 0 5px #34d39933}}
.win[data-app=ai] .bd{display:flex;flex-direction:column}
.ms{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}

@keyframes dt{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-7px) scale(1.2);opacity:1}}
